name: CI
on:
  pull_request:
  push:
    branches: [main]

env:
  PY_REPO: https://github.com/AmineChr54/RL-autonomous-racing

jobs:
  python-side:
    # Always-on checks that do not need jdBasic: the Python original imports and the test scripts compile.
    runs-on: [self-hosted, jdbasic]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: Clone the Python original
        timeout-minutes: 5
        run: git clone --depth 1 "$PY_REPO" "$RUNNER_TEMP/py" && echo "PY_PROJECT=$RUNNER_TEMP/py" >> "$GITHUB_ENV"
      - name: Compile Python tests and tools
        timeout-minutes: 2
        run: python -m py_compile tests/env_parity.py tests/brain_parity.py tools/jd.py
      - name: Python original imports (track, env, brain)
        timeout-minutes: 5
        run: cd "$PY_PROJECT" && python -c "import track, env, brain; print('genome_size', brain.genome_size())"

  jdbasic:
    # jdBasic built natively on Linux from upstream source (ci/Dockerfile, pinned JDBASIC_REF), interpreter and
    # the -c native compiler (LLVM). The container's --memory is the hard cap.
    runs-on: [self-hosted, jdbasic]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: Clone the Python original
        timeout-minutes: 5
        run: git clone --depth 1 "$PY_REPO" "$RUNNER_TEMP/py" && echo "PY_PROJECT=$RUNNER_TEMP/py" >> "$GITHUB_ENV"
      - name: jdBasic smoke test (version, 6*7)
        timeout-minutes: 2
        run: |
          cat /opt/jdbasic/REF
          echo 'PRINT 6*7' > "$RUNNER_TEMP/t.jdb"
          JD_TIME=60 tools/jd.sh run "$RUNNER_TEMP/t.jdb"
      - name: torch_gradcheck (interpreter)
        timeout-minutes: 6
        run: JD_TIME=240 tools/jd.sh run tests/torch_gradcheck.jdb
      - name: torch_gradcheck (native -c)
        timeout-minutes: 6
        run: JD_TIME=240 tools/jd.sh native tests/torch_gradcheck.jdb
      - name: track_check (interpreter + native)
        timeout-minutes: 6
        run: |
          JD_TIME=240 tools/jd.sh run tests/track_check.jdb
          JD_TIME=240 tools/jd.sh native tests/track_check.jdb
      - name: reinforce_grad (interpreter + native)
        timeout-minutes: 6
        run: |
          JD_TIME=240 tools/jd.sh run tests/reinforce_grad.jdb
          JD_TIME=240 tools/jd.sh native tests/reinforce_grad.jdb
      - name: env_parity
        timeout-minutes: 10
        run: python tests/env_parity.py && python tests/env_parity.py --native
      - name: brain_parity
        timeout-minutes: 10
        run: python tests/brain_parity.py && python tests/brain_parity.py --native
      - name: main.jdb headless smoke (interpreter all modes, native evolution + dqn)
        timeout-minutes: 8
        run: bash tests/main_smoke.sh && bash tests/main_smoke.sh native
